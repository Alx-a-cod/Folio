name: Pro Submodule Sync Checker

on:
  schedule:
    - cron: '0 9 * * *'  # Daily at 09:00 CET
  workflow_dispatch:

jobs:
  check-submodules:
    runs-on: ubuntu-latest
    env:
      PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
      PR_BRANCH: submodule-sync-update
      PR_TITLE: "Auto-update submodule references"
      PR_BODY: "This PR updates the submodules to the latest commits from main."

    steps:
      # 1️ Checkout Folio using PAT
      - name: Checkout Folio
        uses: actions/checkout@v3
        with:
          submodules: false
          fetch-depth: 0
          token: ${{ secrets.PAT_TOKEN }}

      # 2️ Update submodules
      - name: Update submodules to latest main
        run: |
          submodules=("Csharp_Algoritms" "CodingVault" "TasteTest" "An-Egg-" "ArtiFact")
          for sub in "${submodules[@]}"; do
            git submodule init $sub || echo "$sub already initialized"
            git submodule update --init --recursive $sub
            git -C $sub fetch origin main
            git -C $sub checkout origin/main
          done

      # 3️ Show submodule status
      - name: Show submodule status
        run: git submodule status

      # 4️ Check for submodule changes
      - name: Check for submodule changes
        id: check_submodules
        run: |
          set -e
          CHANGES=false
          git diff --submodule=log --exit-code || CHANGES=true
          echo "changes=$CHANGES" >> $GITHUB_OUTPUT

      # 5️ Commit changes to a branch (create or update)
      - name: Commit updated submodules to branch
        if: steps.check_submodules.outputs.changes == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Create branch if missing, else switch
          if git show-ref --verify --quiet refs/heads/$PR_BRANCH; then
            git checkout $PR_BRANCH
          else
            git checkout -b $PR_BRANCH
          fi

          git add .
          git commit -m "$PR_TITLE" || echo "No changes to commit"
          git push https://$PAT_TOKEN@github.com/${{ github.repository }} $PR_BRANCH

      # 6️ Authenticate GH CLI and create PR only if missing
      - name: Create Pull Request
        if: steps.check_submodules.outputs.changes == 'true'
        run: |
          echo "$PAT_TOKEN" | gh auth login --with-token
          
          # Check if PR already exists
          if ! gh pr list --head $PR_BRANCH --repo ${{ github.repository }} | grep -q "$PR_BRANCH"; then
            gh pr create \
              --title "$PR_TITLE" \
              --body "$PR_BODY" \
              --head $PR_BRANCH \
              --base main \
              --repo ${{ github.repository }}
          else
            echo "PR already exists for $PR_BRANCH, skipping creation."
